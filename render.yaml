# Render blueprint — deploys all of SpendWise in one click.
# Prerequisites: MongoDB Atlas M0 (free) connection string.
# In Render: New > Blueprint > connect your repo. Set MONGO_URI + JWT_SECRET once
# when prompted. Service-to-service URLs are the stable public onrender.com
# addresses (free services have no private network).

services:
  - type: web
    name: spendwise-discovery
    runtime: node
    rootDir: services/discovery
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free

  - type: web
    name: spendwise-auth
    runtime: node
    rootDir: services/auth
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DISCOVERY_URL
        value: https://spendwise-discovery.onrender.com

  - type: web
    name: spendwise-category
    runtime: node
    rootDir: services/category
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DISCOVERY_URL
        value: https://spendwise-discovery.onrender.com

  - type: web
    name: spendwise-expense
    runtime: node
    rootDir: services/expense
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DISCOVERY_URL
        value: https://spendwise-discovery.onrender.com
      - key: CATEGORY_SERVICE_URL
        value: https://spendwise-category.onrender.com

  - type: web
    name: spendwise-report
    runtime: node
    rootDir: services/report
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DISCOVERY_URL
        value: https://spendwise-discovery.onrender.com
      - key: EXPENSE_SERVICE_URL
        value: https://spendwise-expense.onrender.com
      - key: CATEGORY_SERVICE_URL
        value: https://spendwise-category.onrender.com

  - type: web
    name: spendwise-gateway
    runtime: node
    rootDir: services/gateway
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DISCOVERY_URL
        value: https://spendwise-discovery.onrender.com
      - key: AUTH_SERVICE_URL
        value: https://spendwise-auth.onrender.com
      - key: CATEGORY_SERVICE_URL
        value: https://spendwise-category.onrender.com
      - key: EXPENSE_SERVICE_URL
        value: https://spendwise-expense.onrender.com
      - key: REPORT_SERVICE_URL
        value: https://spendwise-report.onrender.com

  - type: web
    name: spendwise-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GATEWAY_URL
        value: https://spendwise-gateway.onrender.com
